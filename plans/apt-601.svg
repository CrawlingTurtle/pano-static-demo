<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 960" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <!-- 背景 -->
  <rect x="0" y="0" width="1200" height="960" fill="#f2f5f9"/>

  <!-- ============ 公共区域（左侧） ============ -->
  <g stroke="#94a3b8" stroke-width="1.5" fill="#fbfcfe">
    <rect x="70" y="90" width="260" height="210"/>   <!-- 电梯厅 -->
    <rect x="70" y="300" width="260" height="210"/>  <!-- 楼梯间 -->
    <rect x="70" y="510" width="260" height="210"/>  <!-- 共享平台 -->
    <rect x="330" y="90" width="90" height="210"/>   <!-- 02门口走道 -->
    <rect x="330" y="300" width="90" height="210"/>  <!-- 楼梯走道 -->
  </g>
  <rect x="70" y="90" width="350" height="630" fill="none" stroke="#475569" stroke-width="3"/>

  <!-- ============ 601 室内 ============ -->
  <g stroke="#94a3b8" stroke-width="1.5" fill="#f8fafc">
    <rect x="420" y="90" width="140" height="210"/>   <!-- 入户玄关 -->
    <rect x="420" y="300" width="140" height="210"/>  <!-- 北边卧 -->
    <rect x="420" y="510" width="140" height="210"/>  <!-- 南边卧 -->
    <rect x="420" y="720" width="140" height="150"/>  <!-- 西侧走道 -->
    <rect x="560" y="90" width="140" height="330"/>   <!-- 客厅 -->
    <rect x="700" y="90" width="220" height="210"/>   <!-- 入户边卧走道 -->
    <rect x="920" y="90" width="180" height="210"/>   <!-- 入户边卧 -->
    <rect x="920" y="300" width="180" height="210"/>  <!-- 入户边卫 -->
    <rect x="700" y="300" width="220" height="210"/>  <!-- 厨房 -->
    <rect x="560" y="420" width="140" height="300"/>  <!-- 客餐厅中间 -->
    <rect x="700" y="420" width="220" height="300"/>  <!-- 主卧 -->
    <rect x="700" y="720" width="220" height="150"/>  <!-- 主卫 -->
    <rect x="560" y="720" width="140" height="150"/>  <!-- 走道 -->
  </g>
  <!-- 阳台（南向） -->
  <g stroke="#94a3b8" stroke-width="1.5" fill="#eef4fb">
    <rect x="560" y="870" width="270" height="70"/>   <!-- 生活阳台 -->
    <rect x="830" y="870" width="270" height="70"/>   <!-- 景观阳台 -->
  </g>
  <!-- 室内外轮廓（粗线） -->
  <g stroke="#475569" stroke-width="3" fill="none">
    <rect x="420" y="90" width="680" height="780"/>
    <rect x="560" y="870" width="540" height="70"/>
  </g>

  <!-- ============ 门洞（用房间底色覆盖墙线，宽 8 露出缺口） ============ -->
  <g stroke="#f8fafc" stroke-width="8">
    <!-- 公共区 -->
    <line x1="330" y1="120" x2="330" y2="220"/>    <!-- 电梯厅-02门口走道 -->
    <line x1="330" y1="330" x2="330" y2="420"/>    <!-- 楼梯间-楼梯走道 -->
    <line x1="330" y1="300" x2="360" y2="300"/>    <!-- 02门口走道-楼梯走道 -->
    <!-- 室内 -->
    <line x1="420" y1="150" x2="420" y2="240"/>    <!-- 入户门（玄关-02门口走道） -->
    <line x1="560" y1="200" x2="560" y2="290"/>    <!-- 玄关-客厅 -->
    <line x1="700" y1="160" x2="700" y2="250"/>    <!-- 客厅-边卧走道 -->
    <line x1="920" y1="150" x2="920" y2="240"/>    <!-- 边卧走道-入户边卧 -->
    <line x1="920" y1="360" x2="920" y2="450"/>    <!-- 厨房-入户边卫 -->
    <line x1="560" y1="340" x2="560" y2="430"/>    <!-- 北边卧门（开向客厅） -->
    <line x1="700" y1="470" x2="700" y2="510"/>    <!-- 客餐厅-厨房 -->
    <line x1="700" y1="560" x2="700" y2="650"/>    <!-- 客餐厅-主卧 -->
    <line x1="760" y1="720" x2="850" y2="720"/>    <!-- 主卧-主卫 -->
    <line x1="700" y1="760" x2="700" y2="850"/>    <!-- 走道-主卫 -->
    <line x1="560" y1="760" x2="560" y2="850"/>    <!-- 走道-西侧走道 -->
    <line x1="600" y1="420" x2="680" y2="420"/>    <!-- 客厅-客餐厅（开放口） -->
    <line x1="620" y1="870" x2="700" y2="870"/>    <!-- 走道-生活阳台 -->
    <line x1="870" y1="870" x2="930" y2="870"/>    <!-- 主卫-景观阳台 -->
  </g>

  <!-- 门开启弧线 -->
  <g stroke="#94a3b8" stroke-width="1.2" fill="none">
    <path d="M420 150 A90 90 0 0 1 420 240"/>       <!-- 入户门 -->
    <path d="M700 250 A90 90 0 0 1 700 160"/>       <!-- 客厅-边卧走道 -->
    <path d="M700 560 A90 90 0 0 1 700 650"/>       <!-- 主卧门 -->
    <path d="M760 720 A90 90 0 0 0 850 720"/>       <!-- 主卫门 -->
    <path d="M920 150 A70 70 0 0 1 920 240"/>       <!-- 边卧门 -->
    <path d="M560 340 A90 90 0 0 1 560 430"/>       <!-- 北边卧门 -->
    <path d="M700 470 A40 40 0 0 1 700 510"/>       <!-- 厨房门 -->
  </g>

  <!-- ============ 窗户（外墙双线） ============ -->
  <g stroke="#38bdf8" stroke-width="4" fill="none">
    <line x1="600" y1="90" x2="660" y2="90"/>     <!-- 客厅窗 -->
    <line x1="940" y1="90" x2="1060" y2="90"/>    <!-- 边卧窗 -->
    <line x1="1100" y1="360" x2="1100" y2="450"/> <!-- 边卫窗 -->
    <line x1="420" y1="340" x2="420" y2="430"/>   <!-- 北边卧窗 -->
    <line x1="420" y1="550" x2="420" y2="670"/>   <!-- 南边卧窗 -->
    <line x1="560" y1="880" x2="610" y2="880"/>   <!-- 生活阳台窗 -->
    <line x1="1030" y1="880" x2="1090" y2="880"/><!-- 景观阳台窗 -->
  </g>

  <!-- ============ 房间名称 ============ -->
  <g fill="#52606d" font-size="21" text-anchor="middle">
    <text x="200" y="200">电梯厅</text>
    <text x="200" y="412">楼梯间</text>
    <text x="200" y="622">共享平台</text>
    <text x="375" y="160">走道</text>
    <text x="375" y="372">楼梯走道</text>

    <text x="490" y="170">入户玄关</text>
    <text x="490" y="382">北边卧</text>
    <text x="490" y="592">南边卧</text>
    <text x="490" y="802">西侧走道</text>

    <text x="630" y="262">客厅</text>
    <text x="630" y="577">客餐厅</text>
    <text x="630" y="802">走道</text>

    <text x="810" y="160">边卧走道</text>
    <text x="810" y="382">厨房</text>
    <text x="810" y="577">主卧</text>
    <text x="810" y="802">主卫</text>

    <text x="1010" y="170">入户边卧</text>
    <text x="1010" y="382">入户边卫</text>

    <text x="695" y="912">生活阳台</text>
    <text x="965" y="912">景观阳台</text>
  </g>

  <!-- ============ 指北针 & 比例尺 & 标题 ============ -->
  <g transform="translate(1120,60)">
    <circle r="30" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
    <path d="M0 -22 L6 10 L0 4 L-6 10 Z" fill="#f56c6c"/>
    <text x="0" y="46" text-anchor="middle" font-size="16" fill="#64748b">N</text>
  </g>
  <g transform="translate(40,860)">
    <rect x="0" y="-8" width="160" height="6" fill="#475569"/>
    <rect x="0" y="-8" width="80" height="6" fill="#94a3b8"/>
    <text x="80" y="14" text-anchor="middle" font-size="14" fill="#64748b">0 · 2 · 4m</text>
  </g>
  <text x="860" y="60" text-anchor="middle" font-size="22" font-weight="bold" fill="#334155">3栋 601 户型平面图</text>
</svg>
