<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <rect x="0" y="0" width="1200" height="800" fill="#f2f5f9"/>

  <!-- 基坑外轮廓 -->
  <rect x="120" y="100" width="960" height="600" fill="#fdf6ec" stroke="#475569" stroke-width="3" stroke-dasharray="14 8"/>

  <!-- 基坑分区 -->
  <g stroke="#e6a23c" stroke-width="2" stroke-dasharray="10 6" fill="none">
    <line x1="600" y1="100" x2="600" y2="700"/>
  </g>
  <g fill="#fbeee0">
    <rect x="140" y="120" width="440" height="560"/>   <!-- 东区 -->
    <rect x="620" y="120" width="440" height="560"/>   <!-- 西区 -->
  </g>

  <!-- 东区：开挖台阶示意 -->
  <g fill="none" stroke="#d97706" stroke-width="2">
    <rect x="200" y="180" width="320" height="440"/>
    <rect x="260" y="240" width="200" height="320"/>
  </g>

  <!-- 西区：材料堆场 + 便道 -->
  <g fill="#e8f0e8" stroke="#67c23a" stroke-width="1.5">
    <rect x="660" y="160" width="160" height="110"/>
    <rect x="860" y="160" width="170" height="110"/>
  </g>
  <g fill="none" stroke="#94a3b8" stroke-width="2">
    <path d="M620 640 L1180 640 L1180 700 L620 700 Z" fill="#eef2f7"/>
    <line x1="620" y1="640" x2="1180" y2="640"/>
  </g>

  <!-- 塔吊 -->
  <g transform="translate(500,420)">
    <line x1="0" y1="0" x2="80" y2="0" stroke="#475569" stroke-width="5"/>
    <line x1="0" y1="0" x2="0" y2="-90" stroke="#475569" stroke-width="4"/>
    <line x1="80" y1="0" x2="80" y2="-90" stroke="#475569" stroke-width="2"/>
    <line x1="40" y1="-90" x2="40" y2="-20" stroke="#94a3b8" stroke-width="1.5"/>
    <circle cx="40" cy="-18" r="4" fill="#f56c6c"/>
    <line x1="0" y1="-90" x2="80" y2="-90" stroke="#94a3b8" stroke-width="2"/>
  </g>

  <!-- 标注 -->
  <g fill="#52606d" font-size="26" text-anchor="middle">
    <text x="360" y="560" font-weight="bold">基坑东区</text>
    <text x="360" y="596" font-size="17" fill="#b45309">土方开挖 · 垫层施工</text>
    <text x="840" y="330" font-weight="bold">基坑西区</text>
    <text x="840" y="366" font-size="17" fill="#67a14b">材料堆场 · 钢筋加工</text>
    <text x="900" y="676" font-size="18" fill="#475569">施工便道</text>
    <text x="260" y="160" font-size="16" fill="#94a3b8">场地围挡</text>
  </g>

  <!-- 指北针 & 比例尺 & 标题 -->
  <g transform="translate(1140,50)">
    <circle r="28" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
    <path d="M0 -20 L6 9 L0 4 L-6 9 Z" fill="#f56c6c"/>
    <text x="0" y="44" text-anchor="middle" font-size="15" fill="#64748b">N</text>
  </g>
  <g transform="translate(40,750)">
    <rect x="0" y="-7" width="180" height="5" fill="#475569"/>
    <rect x="0" y="-7" width="90" height="5" fill="#94a3b8"/>
    <text x="90" y="12" text-anchor="middle" font-size="13" fill="#64748b">0 · 10 · 20m</text>
  </g>
  <text x="600" y="60" text-anchor="middle" font-size="22" font-weight="bold" fill="#334155">G/F 地面层 · 基坑平面图</text>
</svg>
